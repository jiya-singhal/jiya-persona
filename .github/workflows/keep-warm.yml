# Pings the Render backend every 10 minutes so the free tier never cold-starts
# (measured 43s from cold). Alternative: Render's $7/mo always-warm tier.

name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://jiya-persona-backend.onrender.com/health)
          echo "health returned $code"
          test "$code" = "200"
